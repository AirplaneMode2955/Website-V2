<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Table Talk</title>
<style>
  :root {
    --bg: #141c14;
    --panel: #1b231b;
    --panel-hi: #323631;
    --line: rgba(255, 255, 255, 0.09);
    --primary: #c9dbc3;
    --muted: #8d9289;
    --text: #e7e9e4;
    --good: #6fae74;
    --bad: rgba(217, 79, 61, 0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100%;
  }
  body { display: flex; flex-direction: column; align-items: center; padding: 22px 16px 44px; gap: 16px; }
  .head { text-align: center; }
  .kick { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  h1 {
    font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 500;
    font-size: 30px; color: var(--primary); margin-top: 2px;
  }
  .prompt {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; text-align: center; max-width: 420px;
  }
  .prompt .q { font-size: 15px; }
  .prompt .q b { color: var(--primary); }
  .prompt .dir { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
  ul { list-style: none; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel-hi); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px;
  }
  li.correct { border-color: var(--good); background: rgba(111, 174, 116, 0.12); }
  li.wrong { border-color: var(--bad); }
  .rank { font-size: 12px; color: var(--muted); width: 18px; text-align: center; }
  .club { flex: 1; font-size: 15px; }
  .val { font-size: 13px; color: var(--primary); font-variant-numeric: tabular-nums; }
  .moves { display: flex; flex-direction: column; gap: 3px; }
  .moves button {
    width: 26px; height: 20px; line-height: 1; padding: 0; font-size: 11px;
    border: 1px solid var(--line); border-radius: 6px; background: transparent;
    color: var(--muted); cursor: pointer;
  }
  .moves button:hover:not(:disabled) { color: var(--primary); border-color: rgba(201, 219, 195, 0.4); }
  .moves button:disabled { opacity: 0.25; cursor: default; }
  .row { display: flex; gap: 10px; }
  .cta {
    font: inherit; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--primary); background: transparent; border: 1px solid rgba(201, 219, 195, 0.4);
    border-radius: 8px; padding: 11px 20px; cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .cta:hover { background: var(--primary); color: #172417; }
  .cta.ghost { border-color: var(--line); color: rgba(231, 233, 228, 0.7); }
  .cta.ghost:hover { background: transparent; border-color: rgba(201, 219, 195, 0.4); color: var(--primary); }
  .result {
    font-family: Georgia, serif; font-style: italic; font-size: 20px; color: var(--primary);
    min-height: 26px; text-align: center;
  }
  .sub { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <div class="head">
    <div class="kick">The Arcade · Daily</div>
    <h1>Table Talk</h1>
    <div class="sub" id="sub">—</div>
  </div>

  <div class="prompt">
    <div class="q" id="q">—</div>
    <div class="dir" id="dir">—</div>
  </div>

  <ul id="list"></ul>

  <div class="result" id="result"></div>

  <div class="row">
    <button class="cta" id="submit">Lock it in</button>
    <button class="cta ghost" id="again">New round</button>
  </div>
  <div class="row">
    <button class="cta ghost" id="share" style="display:none">Share</button>
  </div>

<script>
(function () {
  // Stable facts only — nothing that shifts week to week.
  var CLUBS = [
    { name: 'Arsenal',            founded: 1886, capacity: 60704, titles: 13 },
    { name: 'Aston Villa',        founded: 1874, capacity: 42657, titles: 7  },
    { name: 'Chelsea',            founded: 1905, capacity: 40173, titles: 6  },
    { name: 'Everton',            founded: 1878, capacity: 39414, titles: 9  },
    { name: 'Liverpool',          founded: 1892, capacity: 61276, titles: 19 },
    { name: 'Manchester City',    founded: 1880, capacity: 53400, titles: 10 },
    { name: 'Manchester United',  founded: 1878, capacity: 74310, titles: 20 },
    { name: 'Newcastle United',   founded: 1892, capacity: 52305, titles: 4  },
    { name: 'Tottenham Hotspur',  founded: 1882, capacity: 62850, titles: 2  },
    { name: 'Nottingham Forest',  founded: 1865, capacity: 30404, titles: 1  },
    { name: 'Wolverhampton',      founded: 1877, capacity: 31750, titles: 3  },
    { name: 'West Ham United',    founded: 1895, capacity: 62500, titles: 0  },
    { name: 'Leeds United',       founded: 1919, capacity: 37645, titles: 3  },
    { name: 'Sunderland',         founded: 1879, capacity: 49000, titles: 6  }
  ];

  var STATS = [
    { key: 'founded',  q: 'Order these clubs by <b>the year they were founded</b>', dir: 'Oldest first',      asc: true,  fmt: function (v) { return v; } },
    { key: 'capacity', q: 'Order these clubs by <b>current stadium capacity</b>',   dir: 'Biggest ground first', asc: false, fmt: function (v) { return v.toLocaleString(); } },
    { key: 'titles',   q: 'Order these clubs by <b>English top-flight titles won</b>', dir: 'Most titles first', asc: false, fmt: function (v) { return v; } }
  ];

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function seedFrom(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    var a = (h ^= h >>> 16) >>> 0;
    return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function prettyToday() { var d = new Date(); return MONTHS[d.getMonth()] + ' ' + d.getDate(); }

  function shuffle(arr, rand) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  var listEl = document.getElementById('list');
  var qEl = document.getElementById('q');
  var dirEl = document.getElementById('dir');
  var subEl = document.getElementById('sub');
  var resultEl = document.getElementById('result');
  var submitBtn = document.getElementById('submit');
  var againBtn = document.getElementById('again');
  var shareBtn = document.getElementById('share');

  var round;

  function newRound(daily) {
    var rand = daily ? seedFrom('table-talk:' + todayKey()) : seedFrom('tt:' + Math.random());
    var stat = STATS[Math.floor(rand() * STATS.length)];
    var picks = shuffle(CLUBS, rand).slice(0, 5);
    var order = shuffle(picks, rand); // player's starting order
    round = { stat: stat, order: order, locked: false, daily: !!daily };
    subEl.textContent = daily ? prettyToday() + ' · one shot' : 'Practice';
    qEl.innerHTML = stat.q;
    dirEl.textContent = stat.dir;
    resultEl.textContent = '';
    submitBtn.style.display = '';
    shareBtn.style.display = 'none';
    render();
  }

  function correctOrder() {
    var s = round.stat;
    return round.order.slice().sort(function (a, b) {
      return s.asc ? a[s.key] - b[s.key] : b[s.key] - a[s.key];
    });
  }

  function move(i, dir) {
    if (round.locked) return;
    var j = i + dir;
    if (j < 0 || j >= round.order.length) return;
    var t = round.order[i]; round.order[i] = round.order[j]; round.order[j] = t;
    render();
  }

  function render() {
    var target = round.locked ? correctOrder() : null;
    listEl.innerHTML = '';
    round.order.forEach(function (club, i) {
      var li = document.createElement('li');
      if (round.locked) {
        li.className = target[i] && target[i].name === club.name ? 'correct' : 'wrong';
      }
      var rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = (i + 1);
      var name = document.createElement('span'); name.className = 'club'; name.textContent = club.name;
      li.appendChild(rank); li.appendChild(name);

      if (round.locked) {
        var val = document.createElement('span'); val.className = 'val';
        val.textContent = round.stat.fmt(club[round.stat.key]);
        li.appendChild(val);
      } else {
        var moves = document.createElement('div'); moves.className = 'moves';
        var up = document.createElement('button'); up.textContent = '▲'; up.disabled = i === 0;
        up.onclick = function () { move(i, -1); };
        var dn = document.createElement('button'); dn.textContent = '▼'; dn.disabled = i === round.order.length - 1;
        dn.onclick = function () { move(i, 1); };
        moves.appendChild(up); moves.appendChild(dn);
        li.appendChild(moves);
      }
      listEl.appendChild(li);
    });
  }

  function lockIn() {
    if (round.locked) return;
    round.locked = true;
    var target = correctOrder();
    var inPlace = 0, grid = '';
    round.order.forEach(function (club, i) {
      var ok = target[i].name === club.name;
      if (ok) inPlace++;
      grid += ok ? '🟩' : '⬜';
    });
    round.score = inPlace;
    round.grid = grid;
    resultEl.textContent = inPlace + ' / 5 in the right spot';
    submitBtn.style.display = 'none';
    shareBtn.style.display = round.daily ? '' : 'none';
    render();
  }

  submitBtn.addEventListener('click', lockIn);
  againBtn.addEventListener('click', function () { newRound(false); });
  shareBtn.addEventListener('click', function () {
    var text = 'Table Talk · ' + prettyToday() + ' — ' + round.score + '/5\n' + round.grid +
      '\nKnow your table? jettiverson.com/play/table-talk';
    if (navigator.share) { navigator.share({ title: 'Table Talk', text: text }).catch(function () {}); }
    else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () {
        shareBtn.textContent = 'Copied'; setTimeout(function () { shareBtn.textContent = 'Share'; }, 1500);
      });
    } else { window.prompt('Copy', text); }
  });

  newRound(true);
})();
</script>
<script src="/arcade/_resize-reporter.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Remuda Round</title>
<style>
  :root{
    --green-dark:#1b3a2a;
    --green:#254f38;
    --green-light:#3a7a52;
    --tan:#d8c9a3;
    --tan-dark:#b89f6c;
    --cream:#f6f1e4;
    --red:#c1443c;
    --gold:#e0a940;
    --ink:#12251a;
    --shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--green-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color:var(--cream); overscroll-behavior:none; user-select:none;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    padding-bottom:78px; position:relative;}
  header.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--green-dark),var(--green));
    padding:14px 16px 10px;box-shadow:var(--shadow);}
  header.topbar h1{margin:0;font-size:19px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;}
  header.topbar .sub{font-size:12px;color:var(--tan);opacity:.85;margin-top:2px;}
  main{flex:1;padding:14px 14px 20px;}
  .card{background:var(--green);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .card.tan{background:var(--cream);color:var(--ink);}
  h2{margin:0 0 8px;font-size:16px;color:var(--gold);}
  .hole-hero{background:linear-gradient(135deg,var(--green),var(--green-dark));border-radius:18px;padding:18px;
    box-shadow:var(--shadow);margin-bottom:14px;border:1px solid rgba(224,169,64,.25);}
  .hole-hero .rownum{display:flex;justify-content:space-between;align-items:baseline;}
  .hole-hero .holenum{font-size:13px;color:var(--tan);text-transform:uppercase;letter-spacing:1px;}
  .hole-hero .name{font-size:26px;font-weight:700;margin:2px 0 6px;color:var(--cream);}
  .hole-hero .meta{display:flex;gap:14px;font-size:13px;color:var(--tan);flex-wrap:wrap;}
  .hole-hero .meta b{color:var(--cream);}
  .tip{font-size:13px;line-height:1.45;margin-top:10px;color:var(--tan);border-top:1px dashed rgba(216,201,163,.3);padding-top:10px;}
  .gps-box{background:rgba(0,0,0,.18);border-radius:12px;padding:12px 14px;margin-top:12px;}
  .gps-toprow{display:flex;align-items:center;justify-content:space-between;}
  .gps-box .dist{font-size:30px;font-weight:800;color:var(--gold);}
  .gps-box .distlabel{font-size:11px;color:var(--tan);text-transform:uppercase;}
  .gps-box .club{font-size:13px;color:var(--cream);text-align:right;}
  .gps-box .club b{color:var(--gold);font-size:16px;}
  .fcb-row{display:flex;justify-content:space-around;margin-top:8px;font-size:12px;color:var(--tan);}
  .fcb-row b{display:block;color:var(--cream);font-size:15px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:var(--ink);
    border:none;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.secondary{background:rgba(255,255,255,.12);color:var(--cream);}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:10px;}
  .btn.block{width:100%;}
  .btn.danger{background:var(--red);color:#fff;}
  .btn:active{transform:scale(.97);}
  .row{display:flex;gap:10px;}
  .row.wrap{flex-wrap:wrap;}
  .player-score{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.15);
    border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .player-score .pname{font-weight:700;font-size:15px;display:flex;flex-direction:column;}
  .player-score .pname .totalpar{font-size:11px;color:var(--tan);font-weight:400;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{width:36px;height:36px;border-radius:50%;border:none;background:var(--tan-dark);color:var(--ink);
    font-size:18px;font-weight:700;}
  .stepper .num{width:28px;text-align:center;font-size:20px;font-weight:800;color:var(--gold);}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .tag{font-size:11px;padding:5px 9px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--tan);
    border:1px solid rgba(216,201,163,.25);cursor:pointer;}
  .tag.active{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700;}
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--green-dark);
    border-top:1px solid rgba(224,169,64,.2);display:flex;max-width:520px;margin:0 auto;
    box-shadow:0 -4px 14px rgba(0,0,0,.3);}
  nav.tabbar button{flex:1;background:none;border:none;color:var(--tan);padding:10px 4px 8px;font-size:11px;
    display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav.tabbar button .ic{font-size:20px;}
  nav.tabbar button.active{color:var(--gold);}
  table.lb{width:100%;border-collapse:collapse;font-size:14px;}
  table.lb th{text-align:left;font-size:11px;color:var(--tan);text-transform:uppercase;padding:4px 6px;}
  table.lb td{padding:8px 6px;border-top:1px solid rgba(255,255,255,.08);}
  table.lb tr.leader td{color:var(--gold);font-weight:800;}
  .crown{background:linear-gradient(135deg,#3a7a52,#1b3a2a);border-radius:16px;padding:16px;text-align:center;
    margin-bottom:14px;border:1px solid rgba(224,169,64,.35);}
  .crown .who{font-size:22px;font-weight:800;color:var(--gold);margin:4px 0;}
  .crown .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--tan);}
  .talk{background:rgba(224,169,64,.12);border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;
    font-size:13px;color:var(--cream);margin-bottom:14px;line-height:1.4;}
  .holepicker{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px;}
  .holepicker button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:var(--tan);
    border-radius:8px;padding:8px 0;font-size:13px;font-weight:700;}
  .holepicker button.cur{background:var(--gold);color:var(--ink);}
  .holepicker button.done{border-color:var(--green-light);}
  input[type=text],input[type=number]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(0,0,0,.15);
    font-size:15px;margin-bottom:8px;background:#fff;color:var(--ink);}
  label{font-size:12px;color:var(--ink);opacity:.7;}
  .playerchip{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .playerchip input{flex:1;margin-bottom:0;}
  .removebtn{background:var(--red);color:#fff;border:none;border-radius:8px;width:34px;height:34px;font-size:16px;}
  .divider{height:1px;background:rgba(255,255,255,.08);margin:10px 0;}
  .floatbig{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:80px;z-index:60;
    pointer-events:none;animation:floatUp 1.1s ease-out forwards;}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-40%) scale(.5);}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
    80%{opacity:1;transform:translate(-50%,-65%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-80%) scale(1);}}
  .smallnote{font-size:11px;color:var(--tan);opacity:.75;margin-top:4px;}
  .clubgridrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.08);}
  .clubgridrow input{width:70px;margin:0;padding:6px 8px;}
  .calibhole{padding:8px 0;border-bottom:1px solid rgba(0,0,0,.08);}
  .calibhole .hname{color:var(--green-dark);font-weight:700;font-size:13px;margin-bottom:6px;}
  .trackerhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  select.pillselect{background:rgba(255,255,255,.1);color:var(--cream);border:1px solid rgba(216,201,163,.3);
    border-radius:20px;padding:6px 10px;font-size:12px;}
  .shotlist .shotitem{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.1);
    font-size:13px;}
  .shotlist .shotitem b{color:var(--gold);}
  .emptyshots{font-size:12px;color:var(--tan);opacity:.8;padding:6px 0;}
  .gamecard{background:#10131a;border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid rgba(255,255,255,.08);}
  .gamecard h2{color:#dfe6ee;margin:0 0 10px;}
  #miniGameCanvas{width:100%;display:block;border-radius:10px;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none;}
  .mg-hud{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:11px;color:#9fb3c8;margin-top:10px;}
  .mg-hud span{flex:1;min-width:60px;}
  .mg-hud b{color:#fff;font-size:15px;display:block;}
  .mg-controls{margin-top:6px;}
  .mg-sliderrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .mg-sliderrow label{width:52px;font-size:12px;color:#9fb3c8;}
  .mg-sliderrow input[type=range]{flex:1;}
  .mg-sliderrow .val{width:36px;text-align:right;font-size:12px;color:#fff;font-weight:700;}
  .mg-msg{text-align:center;font-size:13px;color:#ffd76b;min-height:18px;margin:8px 0 2px;font-weight:700;}
</style>

<body>
<div id="app">
  <header class="topbar">
    <h1>🐴 <span id="headerTitle">Remuda Round</span></h1>
    <div class="sub" id="headerSub">Farr West, UT · Par 72</div>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-tab="play"><span class="ic">⛳</span>Play</button>
    <button data-tab="card"><span class="ic">📋</span>Card</button>
    <button data-tab="board"><span class="ic">🏆</span>Board</button>
    <button data-tab="game"><span class="ic">🕹️</span>Game</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Settings</button>
  </nav>
</div>
<div id="modalRoot"></div>

<script>
/* ================= COURSE DATA ================= */
const HOLES = [
 {n:1, name:"Appaloosa", par:4, yd:400, rank:17, tip:"Extra-wide fairway. Favor slightly left of the barber pole — grass bunkers lurk right and behind the green."},
 {n:2, name:"Shetland", par:3, yd:138, rank:9, tip:"Pond guards center/right. Take one more club than you think — water doesn't help a short ball. Aim center, sucker pins on the edges."},
 {n:3, name:"Percheron", par:5, yd:457, rank:11, tip:"Dogleg left. The famous 'Remuda Triangle' eats anything sliced hard right. Stay center — good birdie hole if you do."},
 {n:4, name:"Mustang", par:3, yd:200, rank:3, tip:"Huge green — aim for the middle. Miss right, not left (houses left). Hit this green or plan on a bogey."},
 {n:5, name:"Arabian", par:5, yd:500, rank:7, tip:"Long dogleg left, mountain views. Keep tee shot right of center. Huge green — split it in half and go for the front."},
 {n:6, name:"Hackney", par:3, yd:217, rank:1, tip:"Hardest hole on the course. Green looks closer than it is. Two sand bunkers left, wetland right — miss right if you must."},
 {n:7, name:"Belgian", par:5, yd:467, rank:15, tip:"Very do-able par 5 down the middle. Pines both sides. Fairway short of the green won't help — clear it, don't go long."},
 {n:8, name:"Morgan", par:4, yd:367, rank:5, tip:"Deceptive off the tee — anything right is wet cabbage rough. Favor slightly left of the barber pole."},
 {n:9, name:"Quarter", par:4, yd:373, rank:13, tip:"Slight downhill can add 5 yards. Grass bunker guards front-left green. Play safe, don't force a hero shot."},
 {n:10, name:"Clydesdale", par:5, yd:529, rank:8, tip:"Longest par 5 on the course, uphill into the wind — plan on three shots. Generous fairway, big flat green."},
 {n:11, name:"Spanish", par:4, yd:333, rank:16, tip:"Reachable for long knockers. Retention basin right, poplars block the dogleg shortcut. Sand bunker front-left."},
 {n:12, name:"Welsh", par:3, yd:104, rank:18, tip:"Shortest hole on the course — best ace chance you'll get all day. Big green, big bunker right, native tree left."},
 {n:13, name:"Tennessee", par:5, yd:517, rank:10, tip:"Let it rip. Water left/back of a tiered green. Aim right-of-center off the tee for the best second-shot look."},
 {n:14, name:"Hanoverian", par:4, yd:432, rank:6, tip:"Tall trees both sides, wind usually against. Favor right over the poplars on the left. Straightforward if you find the fairway."},
 {n:15, name:"Paint", par:4, yd:364, rank:12, tip:"No OB — swing out of your shoes. Deep bunker front-left, hidden water behind the green. Flat green once you're on."},
 {n:16, name:"Friesian", par:4, yd:453, rank:2, tip:"Long dogleg left into the wind. Bunker right off the tee, water left/right if you try to cut the corner. Play it straight."},
 {n:17, name:"Paso Fino", par:3, yd:212, rank:4, tip:"Deceptive depth — take extra club. Russian olives frame both sides. If you're on, you're in."},
 {n:18, name:"Thoroughbred", par:4, yd:365, rank:14, tip:"Water the full length on the right, range net left. Don't attack a back pin — firm green, downhill from the middle."},
];
const PAR_TOTAL = HOLES.reduce((s,h)=>s+h.par,0);

/* ================= DEFAULT CLUB BAG (yards) ================= */
const DEFAULT_CLUBS = [
 {c:"Driver",d:230},{c:"3 Wood",d:210},{c:"5 Wood",d:195},{c:"4 Iron",d:180},
 {c:"5 Iron",d:170},{c:"6 Iron",d:160},{c:"7 Iron",d:150},{c:"8 Iron",d:140},
 {c:"9 Iron",d:130},{c:"PW",d:115},{c:"GW",d:100},{c:"SW",d:80},{c:"LW",d:60},
];

/* ================= SHOT-TRACKING TUNING ================= */
const MIN_SHOT_YARDS = 15;   // ignore movement smaller than this (repositioning/fidgeting)
const MAX_SHOT_YARDS = 340;  // sanity cap - bigger jumps assumed to be a cart ride/hole transition, not a shot
const STILL_SPEED_MPS = 0.35; // below this speed = considered "stopped"
const STILL_HOLD_MS = 5000;   // must be stopped this long to confirm a dwell point

/* ================= TRASH TALK ================= */
const TALK = {
 eagle:["🦅 EAGLE for {p} on {h} — somebody buy this horse a carrot.","{p} just tamed {h} like it owed them money. Eagle."],
 birdie:["Birdie for {p} on {h}. The Remuda whisperer strikes again.","{p} birdies {h} — steady hands, cold heart."],
 par:["{p} pars {h}. Steady as she goes.","{p} plays it safe on {h}. Nothing to see here, move along."],
 bogey:["{p} bogeys {h}. The pro's advice column just entered the chat.","{p} drops one on {h} — hey, at least you're not in the Triangle."],
 double:["{p} takes a {s} on {h}. Somebody check on them.","{h} bit back — {p} walks away with a {s}."],
 triangle:["The Remuda Triangle claims another victim — {p} on {h}. Ball's gone. So is the pride.","{p} found the Triangle on {h}. That ball's in another dimension."],
 snowman:["{p} carded a {s} on {h}. New club recommendation: bowling.","{p}'s scorecard just called in a favor after {h}."],
};
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function talkFor(holeName, playerName, strokes, par, holeNum){
  const diff = strokes - par;
  let bucket;
  if(holeNum===3 && diff>=2) bucket="triangle";
  else if(strokes>=8) bucket="snowman";
  else if(diff<=-2) bucket="eagle";
  else if(diff===-1) bucket="birdie";
  else if(diff===0) bucket="par";
  else if(diff===1) bucket="bogey";
  else bucket="double";
  return pick(TALK[bucket]).replace("{p}",playerName).replace(/{h}/g,holeName).replace("{s}",strokes);
}

/* ================= STATE ================= */
const LS_SETTINGS = "remuda_settings_v1";
const LS_ROUND = "remuda_round_v1";

function loadSettings(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_SETTINGS) || "{}");
    let greens = raw.greens || {};
    // migrate old single-point format {n:{lat,lng}} -> {n:{center:{lat,lng}}}
    Object.keys(greens).forEach(k=>{
      if(greens[k] && typeof greens[k].lat === "number"){
        greens[k] = {center:{lat:greens[k].lat, lng:greens[k].lng}};
      }
    });
    return {clubs: raw.clubs || DEFAULT_CLUBS, greens};
  }catch(e){return {clubs: DEFAULT_CLUBS, greens:{}};}
}
function saveSettings(s){ localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }
let settings = loadSettings();

function loadRound(){
  try{
    const r = JSON.parse(localStorage.getItem(LS_ROUND) || "null");
    if(r){
      if(!r.shotLog) r.shotLog = {};
      if(!r.dwell) r.dwell = {};
      if(typeof r.autoTrackPaused !== "boolean") r.autoTrackPaused = false;
      if(!r.trackedPlayerId && r.players && r.players[0]) r.trackedPlayerId = r.players[0].id;
      if(!r.longDrive) r.longDrive = {};
      if(!r.ctp) r.ctp = {};
    }
    return r;
  }catch(e){return null;}
}
function saveRound(){ localStorage.setItem(LS_ROUND, JSON.stringify(round)); }
let round = loadRound();

function newRound(players){
  round = {
    players, // [{id,name}]
    currentHole: 1,
    scores: {},  // holeNum -> {playerId: strokes}
    tags: {},    // holeNum -> {playerId: [tagKeys]}
    longDrive: {}, // holeNum -> playerId
    ctp: {},       // holeNum -> playerId (closest to pin, par3s only)
    shotLog: {},   // holeNum -> [{from,to,distanceYards,club,toGreenAfter,ts}]
    dwell: {},     // holeNum -> {lat,lng} last confirmed "stopped" point for shot tracking
    autoTrackPaused: false,
    trackedPlayerId: players[0] ? players[0].id : null,
    startedAt: Date.now(),
  };
  saveRound();
}

/* ================= XP / POINTS ================= */
const TAGDEFS = {
  gir:{label:"GIR", pts:2, icon:"🎯"},
  sandy:{label:"Sandy", pts:3, icon:"🏖️"},
  onePutt:{label:"1-Putt", pts:1, icon:"🕳️"},
  threePutt:{label:"3-Putt", pts:-1, icon:"😬"},
};
function scoreXP(holeNum, playerId){
  const h = HOLES[holeNum-1];
  const strokes = (round.scores[holeNum]||{})[playerId];
  let xp = 0;
  if(strokes){
    const diff = strokes - h.par;
    if(diff<=-2) xp+=8; else if(diff===-1) xp+=5; else if(diff===0) xp+=2; else if(diff===1) xp+=0; else xp-=2;
    if(holeNum===3 && diff>=2) xp-=2; // Remuda Triangle penalty
  }
  const tagList = (round.tags[holeNum]||{})[playerId] || [];
  tagList.forEach(t=>{ if(TAGDEFS[t]) xp += TAGDEFS[t].pts; });
  if(round.longDrive[holeNum]===playerId) xp += 3;
  if(round.ctp[holeNum]===playerId) xp += 3;
  return xp;
}
function totalXP(playerId){
  let sum=0;
  for(let n=1;n<=18;n++) sum += scoreXP(n, playerId);
  return sum;
}
function totalStrokes(playerId){
  let sum=0, holesPlayed=0, parSoFar=0;
  for(let n=1;n<=18;n++){
    const s=(round.scores[n]||{})[playerId];
    if(s){ sum+=s; holesPlayed++; parSoFar += HOLES[n-1].par; }
  }
  return {sum, holesPlayed, toPar: sum - parSoFar};
}

/* ================= GPS / DISTANCE ================= */
let liveCoords = null;
function haversineMeters(lat1,lon1,lat2,lon2){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}
function haversineYards(lat1,lon1,lat2,lon2){ return haversineMeters(lat1,lon1,lat2,lon2)*1.09361; }

function distFromPointToGreen(holeNum, lat, lng, which){
  const g = settings.greens[holeNum];
  if(!g) return null;
  const target = g[which];
  if(!target) return null;
  return Math.round(haversineYards(lat,lng,target.lat,target.lng));
}
function distsToGreen(holeNum){
  if(!liveCoords) return {front:null,center:null,back:null};
  return {
    front: distFromPointToGreen(holeNum, liveCoords.lat, liveCoords.lng, "front"),
    center: distFromPointToGreen(holeNum, liveCoords.lat, liveCoords.lng, "center"),
    back: distFromPointToGreen(holeNum, liveCoords.lat, liveCoords.lng, "back"),
  };
}
function suggestClub(distance){
  if(distance==null) return null;
  const clubs = settings.clubs;
  let best=clubs[0], bestDiff=Infinity;
  clubs.forEach(c=>{ const d=Math.abs(c.d-distance); if(d<bestDiff){bestDiff=d;best=c;} });
  return best.c;
}

/* ================= AUTOMATED SHOT TRACKING (beta) ================= */
// Heuristic: watch live GPS. When the player is confirmed "stopped" (low speed
// sustained for STILL_HOLD_MS) at a spot meaningfully different from their last
// confirmed stop on this hole, log that gap as a shot. Log-only (per your call) -
// it never touches the official stroke count.
let posBuffer = [];
let stillSince = null;

function trackShot(pos){
  if(!round) return;
  const t = pos.timestamp || Date.now();
  const lat = pos.coords.latitude, lng = pos.coords.longitude;
  posBuffer.push({lat,lng,t});
  if(posBuffer.length>15) posBuffer.shift();
  if(posBuffer.length<2) return;
  const prev = posBuffer[posBuffer.length-2];
  const dtSec = (t - prev.t)/1000;
  if(dtSec < 1) return; // too soon to trust a speed calc
  const distM = haversineMeters(prev.lat,prev.lng,lat,lng);
  const speed = distM/dtSec;
  if(speed < STILL_SPEED_MPS){
    if(!stillSince) stillSince = t;
    if(t - stillSince >= STILL_HOLD_MS){
      finalizeDwell(lat,lng, round.currentHole);
    }
  } else {
    stillSince = null;
  }
}
function finalizeDwell(lat,lng,holeNum){
  if(!round || round.autoTrackPaused) return;
  const prev = round.dwell[holeNum];
  if(!prev){
    round.dwell[holeNum] = {lat,lng};
    saveRound();
    return;
  }
  const distYards = haversineYards(prev.lat,prev.lng,lat,lng);
  if(distYards < MIN_SHOT_YARDS) return; // noise - keep existing baseline, don't log
  if(distYards <= MAX_SHOT_YARDS){
    const toGreenAfter = distFromPointToGreen(holeNum, lat, lng, "center");
    const club = suggestClub(distYards);
    if(!round.shotLog[holeNum]) round.shotLog[holeNum] = [];
    round.shotLog[holeNum].push({
      from:{lat:prev.lat,lng:prev.lng}, to:{lat,lng},
      distanceYards: Math.round(distYards), club, toGreenAfter, ts: Date.now()
    });
  }
  // big jump (>MAX_SHOT_YARDS) probably a cart ride or hole change - don't log, just rebase
  round.dwell[holeNum] = {lat,lng};
  saveRound();
  if(currentTab==="play") renderPlay();
}
function undoLastShot(holeNum){
  const log = round.shotLog[holeNum];
  if(!log || !log.length) return;
  const last = log.pop();
  round.dwell[holeNum] = last.from;
  saveRound(); renderPlay();
}
function toggleAutoTrack(){
  round.autoTrackPaused = !round.autoTrackPaused;
  saveRound(); renderPlay();
}

function startGPS(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(pos=>{
    liveCoords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    trackShot(pos);
    if(currentTab==="play") renderPlay();
  }, err=>{ /* silent - course wifi/cell can be spotty */ }, {enableHighAccuracy:true, maximumAge:4000, timeout:8000});
}

function renderPlayerScoreRow(n,p){
  const s = (round.scores[n]||{})[p.id] || HOLES[n-1].par;
  const tagList = ((round.tags[n]||{})[p.id])||[];
  return `
  <div class="player-score">
    <div class="pname">${p.name}<span class="totalpar">${scoreLabel(s, HOLES[n-1].par)}</span></div>
    <div class="stepper">
      <button data-dec="${p.id}">−</button>
      <div class="num" id="num_${p.id}_${n}">${s}</div>
      <button data-inc="${p.id}">+</button>
    </div>
  </div>
  <div class="tagrow" style="margin-bottom:10px;">
    ${Object.entries(TAGDEFS).map(([k,def])=>`<span class="tag ${tagList.includes(k)?'active':''}" data-tag="${k}" data-player="${p.id}">${def.icon} ${def.label}</span>`).join("")}
  </div>`;
}
function scoreLabel(s,par){
  const diff=s-par;
  if(diff<=-2) return "Eagle+ 🦅"; if(diff===-1) return "Birdie 🐦"; if(diff===0) return "Par"; if(diff===1) return "Bogey";
  if(diff===2) return "Double"; return `+${diff}`;
}
function wirePlayerScoreRows(n){
  round.players.forEach(p=>{
    if(!round.scores[n]) round.scores[n]={};
    if(round.scores[n][p.id]===undefined) round.scores[n][p.id]=HOLES[n-1].par;
  });
  mainEl.querySelectorAll("[data-inc]").forEach(b=>b.addEventListener("click",()=>{
    const pid=b.dataset.inc; round.scores[n][pid]=Math.min(12,(round.scores[n][pid]||HOLES[n-1].par)+1); saveRound(); renderPlay();
  }));
  mainEl.querySelectorAll("[data-dec]").forEach(b=>b.addEventListener("click",()=>{
    const pid=b.dataset.dec; round.scores[n][pid]=Math.max(1,(round.scores[n][pid]||HOLES[n-1].par)-1); saveRound(); renderPlay();
  }));
  mainEl.querySelectorAll("[data-tag]").forEach(b=>b.addEventListener("click",()=>{
    const pid=b.dataset.player, tagKey=b.dataset.tag;
    if(!round.tags[n]) round.tags[n]={};
    if(!round.tags[n][pid]) round.tags[n][pid]=[];
    const idx=round.tags[n][pid].indexOf(tagKey);
    if(idx>-1) round.tags[n][pid].splice(idx,1); else round.tags[n][pid].push(tagKey);
    saveRound(); renderPlay();
  }));
}
function maybeCelebrate(strokes, par){
  const diff = strokes-par;
  if(diff<=-1 || strokes>=8){
    const emoji = diff<=-2 ? "🦅" : diff===-1 ? "🐦" : "😬";
    const el=document.createElement("div"); el.className="floatbig"; el.textContent=emoji;
    document.body.appendChild(el); setTimeout(()=>el.remove(),1150);
  }
}

/* ---------- LEADERBOARD SCREEN ---------- */
function longestAutoDrive(){
  let best=null;
  Object.keys(round.shotLog||{}).forEach(hn=>{
    const log = round.shotLog[hn];
    if(log && log.length){
      const drive = log[0];
      if(!best || drive.distanceYards>best.distanceYards) best={...drive, hole:hn};
    }
  });
  return best;
}
function renderBoard(){
  const strokeRows = round.players.map(p=>({p, t:totalStrokes(p.id)})).sort((a,b)=>a.t.toPar-b.t.toPar);

      <div class="label">${xpRows[0].xp} pts</div>

    ${talkLines.length? `<div class="talk">${talkLines.map(t=>`<div style="margin-bottom:6px;">${t}</div>`).join("")}</div>`:""}
    <div class="card">
      <h2>Stroke Leaderboard</h2>

      </table>
    </div>
    <div class="card">

      <table class="lb">
        <thead><tr><th>Player</th><th>XP</th></tr></thead>

      </table>
      <p class="smallnote">XP: Eagle+8 · Birdie+5 · Par+2 · Bogey+0 · Double+ −2 · GIR+2 · Sandy+3 · 1-Putt+1 · 3-Putt−1 · Long Drive+3 · Closest to Pin+3 · Remuda Triangle disaster on #3 −2</p>
    </div>
  `;
}
function buildRecentTalk(){
  const lines=[];
  for(let n=1;n<=18;n++){
    const hs = round.scores[n]; if(!hs) continue;
    round.players.forEach(p=>{
      if(hs[p.id]!==undefined){
        lines.push(talkFor(HOLES[n-1].name, p.name, hs[p.id], HOLES[n-1].par, n));
      }
    });
  }
  const shuffled = lines.sort(()=>Math.random()-0.5);
  return shuffled.slice(0,3);
}

  clubEl.querySelectorAll("[data-clubidx]").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      settings.clubs[inp.dataset.clubidx].d = parseInt(inp.value)||0;
      saveSettings(settings);
    });
  });
  document.getElementById("resetClubsBtn").addEventListener("click",()=>{
    settings.clubs = JSON.parse(JSON.stringify(DEFAULT_CLUBS)); saveSettings(settings); renderSettings();
  });
  document.getElementById("wipeRoundBtn").addEventListener("click",()=>{
    if(confirm("Clear the current round? This can't be undone.")){
      localStorage.removeItem(LS_ROUND); round=null; currentTab="play"; renderAll();
    }
  });
}

/* ================= MINI GAME: Remuda Links (Night Round) ================= */
const MG_W = 280, MG_H = 168, MG_G = 340;
let mg = null;
let mgLastTs = null;

function mgInit(){
  mg = {
    terrain: [], xFlag: 0, sand: null, water: null,
    ball: {x:12, y:0, vx:0, vy:0},
    strokes: 0,
    best: (()=>{ const v = localStorage.getItem("remuda_mg_best"); return v ? parseInt(v) : null; })(),
    wind: 0, state: "aim", angle: 35, power: 60, msg: "", loopRunning:false,
  };
  mgGenerateHole();
}
function mgTerrainY(x){
  const t = mg.terrain;
  if(x<=t[0].x) return t[0].y;
  if(x>=t[t.length-1].x) return t[t.length-1].y;
  for(let i=0;i<t.length-1;i++){
    if(x>=t[i].x && x<=t[i+1].x){
      const f=(x-t[i].x)/(t[i+1].x-t[i].x);
      return t[i].y + (t[i+1].y-t[i].y)*f;
    }
  }
  return t[t.length-1].y;
}
function mgGenerateHole(){
  const seed = Math.random()*1000;
  const baseline = MG_H*0.6;
  const pts=[];
  for(let x=0;x<=MG_W;x+=4){
    const n = Math.sin(x*0.018+seed)*14 + Math.sin(x*0.05+seed*2)*7 + Math.sin(x*0.008+seed*3)*20;
    pts.push({x, y: baseline + n});
  }
  const flagX = MG_W*(0.72+Math.random()*0.16);
  let greenY = baseline;
  for(const p of pts){ if(p.x>=flagX){ greenY = p.y; break; } }
  pts.forEach(p=>{ if(Math.abs(p.x-flagX)<16) p.y = greenY; });
  let sand=null;
  if(Math.random()<0.8){
    const sx = MG_W*(0.36+Math.random()*0.22);
    sand = {x1: sx-14, x2: sx+14};
    pts.forEach(p=>{ if(p.x>=sand.x1 && p.x<=sand.x2) p.y += 9; });
  }
  const water = Math.random()<0.35 ? {x1: MG_W*0.18, x2: MG_W*0.18 + MG_W*0.08} : null;
  mg.terrain = pts;
  mg.xFlag = flagX;
  mg.sand = sand;
  mg.water = water;
  mg.ball = {x:12, y: mgTerrainY(12)-2, vx:0, vy:0};
  mg.strokes = 0;
  mg.wind = Math.round((Math.random()*2-1)*12);
  mg.state = "aim";
  mg.msg = "";
}
function mgFire(){
  if(mg.state!=="aim" && mg.state!=="resting") return;
  const rad = mg.angle*Math.PI/180;
  mg.ball.vx = Math.cos(rad)*mg.power*2.6;
  mg.ball.vy = -Math.sin(rad)*mg.power*2.6;
  mg.strokes++;
  mg.state = "flying";
  mg.msg = "";
}
function mgCheckHole(){
  if(Math.abs(mg.ball.x - mg.xFlag) < 6){
    mg.state = "holed";
    if(mg.best==null || mg.strokes < mg.best){
      mg.best = mg.strokes;
      localStorage.setItem("remuda_mg_best", String(mg.best));
    }
    mg.msg = `⛳ In the hole! ${mg.strokes} stroke${mg.strokes===1?'':'s'}.`;
  } else {
    mg.msg = mg.ball.x < mg.xFlag ? "Short — line it up again." : "Through the green — dial back the power.";
  }
}
function mgStep(dt){
  if(!mg || mg.state!=="flying") return;
  mg.ball.vx += (mg.wind*0.6)*dt;
  mg.ball.vy += MG_G*dt;
  mg.ball.x += mg.ball.vx*dt;
  mg.ball.y += mg.ball.vy*dt;
  if(mg.water && mg.ball.x>=mg.water.x1 && mg.ball.x<=mg.water.x2 && mg.ball.y>=mgTerrainY(mg.ball.x)-2){
    mg.strokes++;
    mg.ball = {x: mg.water.x1-6, y: mgTerrainY(mg.water.x1-6)-2, vx:0, vy:0};
    mg.state = "resting";
    mg.msg = "💦 Splash! +1 penalty stroke.";
    return;
  }
  const groundY = mgTerrainY(mg.ball.x);
  if(mg.ball.y >= groundY){
    mg.ball.y = groundY;
    const inSand = mg.sand && mg.ball.x>=mg.sand.x1 && mg.ball.x<=mg.sand.x2;
    const speed = Math.hypot(mg.ball.vx, mg.ball.vy);
    if(speed < 55){
      mg.ball.vx=0; mg.ball.vy=0;
      mg.state="resting";
      mgCheckHole();
      return;
    }
    mg.ball.vy = -mg.ball.vy * (inSand?0.12:0.38);
    mg.ball.vx *= (inSand?0.35:0.82);
  }
  if(mg.ball.x > MG_W+6 || mg.ball.x < -6){
    mg.strokes++;
    mg.ball = {x:12, y: mgTerrainY(12)-2, vx:0, vy:0};
    mg.state = "resting";
    mg.msg = "Out of bounds — reset, +1 stroke.";
  }
}
function mgDraw(){
  const canvas = document.getElementById("miniGameCanvas");
  if(!canvas || !mg) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,MG_W,MG_H);
  const sky = ctx.createLinearGradient(0,0,0,MG_H);
  sky.addColorStop(0,"#0c1220"); sky.addColorStop(0.6,"#1b2740"); sky.addColorStop(1,"#2c3b57");
  ctx.fillStyle = sky; ctx.fillRect(0,0,MG_W,MG_H);
  ctx.fillStyle="#e8e6d8";
  ctx.beginPath(); ctx.arc(MG_W*0.78, 26, 13, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle="rgba(12,18,32,.5)";
  ctx.beginPath(); ctx.arc(MG_W*0.78-5,22,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(MG_W*0.78+4,30,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="rgba(220,225,235,.16)";
  [[30,20,16],[74,34,10],[150,15,20]].forEach(([cx,cy,r])=>{
    ctx.beginPath(); ctx.ellipse(cx,cy,r,r*0.5,0,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle="#151b2c";
  const cx=MG_W*0.14, baseY=MG_H*0.6;
  ctx.beginPath();
  ctx.moveTo(cx-26, baseY); ctx.lineTo(cx-26, baseY-22);
  ctx.lineTo(cx-20, baseY-22); ctx.lineTo(cx-20, baseY-30); ctx.lineTo(cx-14, baseY-30); ctx.lineTo(cx-14, baseY-22);
  ctx.lineTo(cx-4, baseY-22); ctx.lineTo(cx-4, baseY-38); ctx.lineTo(cx+4, baseY-38); ctx.lineTo(cx+4, baseY-22);
  ctx.lineTo(cx+14, baseY-22); ctx.lineTo(cx+14, baseY-30); ctx.lineTo(cx+20, baseY-30); ctx.lineTo(cx+20, baseY-22);
  ctx.lineTo(cx+26, baseY-22); ctx.lineTo(cx+26, baseY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle="#3d4f3a";
  ctx.beginPath(); ctx.moveTo(0,MG_H);
  mg.terrain.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(MG_W,MG_H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#6d8a5f"; ctx.lineWidth=2;
  ctx.beginPath();
  mg.terrain.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.stroke();
  if(mg.sand){
    ctx.fillStyle="#c9b183";
    ctx.beginPath(); ctx.moveTo(mg.sand.x1, mgTerrainY(mg.sand.x1));
    for(let x=mg.sand.x1;x<=mg.sand.x2;x+=4) ctx.lineTo(x, mgTerrainY(x));
    ctx.lineTo(mg.sand.x2, MG_H); ctx.lineTo(mg.sand.x1, MG_H);
    ctx.closePath(); ctx.fill();
  }
  if(mg.water){
    ctx.fillStyle="rgba(80,140,180,.55)";
    ctx.beginPath(); ctx.moveTo(mg.water.x1, mgTerrainY(mg.water.x1));
    for(let x=mg.water.x1;x<=mg.water.x2;x+=4) ctx.lineTo(x, mgTerrainY(x));
    ctx.lineTo(mg.water.x2, MG_H); ctx.lineTo(mg.water.x1, MG_H);
    ctx.closePath(); ctx.fill();
  }
  const flagGroundY = mgTerrainY(mg.xFlag);
  ctx.strokeStyle="#e8e6d8"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(mg.xFlag, flagGroundY); ctx.lineTo(mg.xFlag, flagGroundY-30); ctx.stroke();
  ctx.fillStyle="#c1443c";
  ctx.beginPath(); ctx.moveTo(mg.xFlag, flagGroundY-30); ctx.lineTo(mg.xFlag+14, flagGroundY-25); ctx.lineTo(mg.xFlag, flagGroundY-20); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#0c1220";
  ctx.beginPath(); ctx.ellipse(mg.xFlag, flagGroundY, 5,2,0,0,Math.PI*2); ctx.fill();
  if(mg.state==="aim" || mg.state==="resting"){
    ctx.fillStyle="rgba(255,255,255,.5)";
    const rad = mg.angle*Math.PI/180;
    let px=mg.ball.x, py=mg.ball.y;
    let vx=Math.cos(rad)*mg.power*2.6, vy=-Math.sin(rad)*mg.power*2.6;
    for(let i=0;i<26;i++){
      vy += MG_G*0.035; px += vx*0.035; py += vy*0.035;
      if(py >= mgTerrainY(px)) break;
      if(i%2===0) ctx.fillRect(px-1,py-1,2,2);
    }
  }
  ctx.fillStyle="#f6f1e4";
  ctx.beginPath(); ctx.arc(mg.ball.x, mg.ball.y-2, 2.4, 0, Math.PI*2); ctx.fill();
}
function mgUpdateHud(){
  const elS=document.getElementById("mgStrokes"); if(elS) elS.textContent = mg.strokes;
  const elW=document.getElementById("mgWind"); if(elW) elW.textContent = mg.wind>0?("→"+mg.wind):mg.wind<0?("←"+Math.abs(mg.wind)):"calm";
  const elB=document.getElementById("mgBest"); if(elB) elB.textContent = mg.best!=null?mg.best:'–';
  const elP=document.getElementById("mgToPin"); if(elP) elP.textContent = Math.round(Math.abs(mg.xFlag-mg.ball.x)*1.3);
  const elM=document.getElementById("mgMsg"); if(elM) elM.textContent = mg.msg||"";
}
function mgLoop(ts){
  if(!mg || currentTab!=="game"){ if(mg) mg.loopRunning=false; mgLastTs=null; return; }
  if(mgLastTs==null) mgLastTs = ts;
  let dt = (ts-mgLastTs)/1000; mgLastTs = ts;
  dt = Math.min(dt, 0.032);
  mgStep(dt);
  mgDraw();
  mgUpdateHud();
  requestAnimationFrame(mgLoop);
}
function renderMiniGame(){
  if(!mg) mgInit();
  mainEl.innerHTML = `
    <div class="card gamecard">
      <h2>🕹️ Remuda Links — Night Round</h2>
      <canvas id="miniGameCanvas" width="${MG_W}" height="${MG_H}"></canvas>
      <div class="mg-hud">
        <span>Strokes<b id="mgStrokes">0</b></span>
        <span>To pin (yd)<b id="mgToPin">–</b></span>
        <span>Wind<b id="mgWind">calm</b></span>
        <span>Best<b id="mgBest">${mg.best!=null?mg.best:'–'}</b></span>
      </div>
      <div class="mg-msg" id="mgMsg"></div>
      <div class="mg-controls">
        <div class="mg-sliderrow">
          <label>Angle</label>
          <input type="range" id="mgAngle" min="10" max="75" value="${mg.angle}">
          <span class="val" id="mgAngleVal">${mg.angle}°</span>
        </div>
        <div class="mg-sliderrow">
          <label>Power</label>
          <input type="range" id="mgPower" min="10" max="100" value="${mg.power}">
          <span class="val" id="mgPowerVal">${mg.power}</span>
        </div>
        <div class="row">
          <button class="btn block" id="mgFireBtn">Whack it 🏌️</button>
          <button class="btn secondary" id="mgNewBtn">New Hole</button>
        </div>
      </div>
      <p class="smallnote">Pixel-art night links — set your angle and power and fire. Sand slows the roll, water costs a penalty stroke. Just for fun between holes — doesn't touch the real scorecard.</p>
    </div>
  `;
  document.getElementById("mgAngle").addEventListener("input", e=>{
    mg.angle = parseInt(e.target.value); document.getElementById("mgAngleVal").textContent = mg.angle+"°";
  });
  document.getElementById("mgPower").addEventListener("input", e=>{
    mg.power = parseInt(e.target.value); document.getElementById("mgPowerVal").textContent = mg.power;
  });
  document.getElementById("mgFireBtn").addEventListener("click", mgFire);
  document.getElementById("mgNewBtn").addEventListener("click", ()=>{ mgGenerateHole(); mgUpdateHud(); mgDraw(); });
  mgUpdateHud();
  mgDraw();
  if(!mg.loopRunning){ mg.loopRunning = true; requestAnimationFrame(mgLoop); }
}

/* ================= INIT ================= */
startGPS();
renderAll();
</script>
